<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 // Grand Billionaire City RP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 160px clamp(1.5rem, 5vw, 6%) 100px;
            position: relative;
            background:
                radial-gradient(circle at 50% 30%, rgba(239, 68, 68, 0.08), transparent 60%),
                var(--abyss, #050202);
            width: 100%;
            overflow: hidden;
        }

        .error-code {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(6rem, 18vw, 14rem);
            line-height: 1;
            background: var(--red-gradient, linear-gradient(135deg, #f87171 0%, #dc2626 50%, #991b1b 100%));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
            text-shadow: 0 20px 60px rgba(239, 68, 68, 0.25);
            margin-bottom: 0.5rem;
        }

        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.45rem 1.1rem;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid var(--border-red, rgba(239, 68, 68, 0.35));
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--scarlet-bright, #f87171);
            margin-bottom: 2rem;
            backdrop-filter: blur(12px);
        }

        .error-badge .status-dot {
            width: 7px;
            height: 7px;
            background-color: var(--scarlet-bright, #f87171);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--scarlet-bright, #f87171);
            animation: pulseDot 2s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        .error-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.6rem, 3.2vw, 2.6rem);
            font-weight: 800;
            color: var(--text-main, #f8fafc);
            margin-bottom: 1rem;
            letter-spacing: -0.01em;
        }

        .error-subtitle {
            color: var(--text-muted, #94a3b8);
            font-size: clamp(0.95rem, 1.4vw, 1.1rem);
            max-width: 560px;
            margin-bottom: 3rem;
            line-height: 1.7;
        }

        .error-inscription-panel {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            padding: 2rem 3rem;
            border-radius: 20px;
            background: rgba(12, 5, 5, 0.5);
            border: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.08));
            backdrop-filter: blur(15px);
            margin-bottom: 3rem;
        }

        .error-inscription-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-muted, #94a3b8);
        }

        .error-inscription-text {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.4rem, 2.6vw, 2rem);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--scarlet-bright, #f87171);
            text-shadow: 0 0 25px rgba(239, 68, 68, 0.35);
        }

        .error-actions {
            display: flex;
            gap: 1.2rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

    <!-- Injected Header Placeholder -->
    <div id="site-header"></div>

    <!-- Error Hero -->
    <header class="error-hero">
        <div class="error-badge">
            <span class="status-dot"></span>
            Page Not Found
        </div>

        <div class="error-code">404</div>
        <h1 class="error-title">This District Doesn't Exist</h1>
        <p class="error-subtitle">The page you're looking for has been relocated, renamed, or was never built within the empire. Check the address and try again.</p>

        <div class="error-inscription-panel">
            <span class="error-inscription-label">Notice</span>
            <span class="error-inscription-text">Under Maintenance</span>
        </div>

        <div class="error-actions">
            <a href="index.html" class="btn-primary">Return Home</a>
            <a href="https://discord.gg/WNbtdvn65" target="_blank" rel="noopener noreferrer" class="btn-secondary">Join Discord</a>
        </div>
    </header>

    <!-- Injected Footer Placeholder -->
    <div id="site-footer"></div>

    <script src="script.js"></script>
</body>
</html>
