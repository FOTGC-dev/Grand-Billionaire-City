<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBC - Player Login & Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-brand"><span class="brand-badge">GBC</span><span class="brand-title">AUTHENTICATION</span></div>
        <div class="nav-actions"><a href="index.html" class="btn-nav">HOME PORTAL</a></div>
    </nav>

    <div class="page-view" style="max-width: 450px; margin-top: 50px;">
        <div class="admin-form-container">
            <h3 style="margin-bottom: 20px; text-align: center; color: var(--accent-gold);">Player Portal Access</h3>
            <div class="tab-selector" style="margin-bottom: 20px;">
                <button class="tab-btn active" id="tabLoginBtn" onclick="switchAuthTab('login')">Login</button>
                <button class="tab-btn" id="tabRegisterBtn" onclick="switchAuthTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleUserLogin(event)">
                <div class="form-group"><label>Username or Email</label><input type="text" id="loginUser" required placeholder="Enter username"></div>
                <div class="form-group"><label>Password</label><input type="password" id="loginPass" required placeholder="••••••••"></div>
                <button type="submit" class="btn-primary">LOGIN</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" style="display: none;" onsubmit="handleUserRegister(event)">
                <div class="form-group"><label>Choose Username</label><input type="text" id="regUser" required placeholder="Username"></div>
                <div class="form-group"><label>Email Address</label><input type="email" id="regEmail" required placeholder="name@domain.com"></div>
                <div class="form-group"><label>Password</label><input type="password" id="regPass" required placeholder="Secure password"></div>
                <button type="submit" class="btn-primary">CREATE ACCOUNT</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function switchAuthTab(tab) {
            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
            document.getElementById('tabLoginBtn').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegisterBtn').classList.toggle('active', tab === 'register');
        }
    </script>
</body>
</html>
