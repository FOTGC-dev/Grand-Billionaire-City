<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GBC - Player Portal</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-body">
    <div class="auth-card">
        <h2>Player Portal</h2>
        <form onsubmit="handleUserLogin(event)">
            <label>Username or Email</label><input type="text" id="loginUser" required>
            <label>Password</label><input type="password" id="loginPass" required>
            <button type="submit" class="btn-primary" style="margin-top:15px;">LOGIN</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
