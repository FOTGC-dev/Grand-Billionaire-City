<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | GBC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">
      <span>GBC</span>
      <small>GRAND BILLIONAIRE CITY</small>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#store">Store</a>
      <a href="login.html">Player Login</a>
    </nav>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <span class="eyebrow">JOIN GBC</span>
      <h1>Create your account.</h1>
      <p class="auth-subtitle">Start building your empire today.</p>

      <div id="register-message" class="form-message" role="alert"></div>

      <form id="register-form">
        <label for="register-username">Username</label>
        <input
          id="register-username"
          type="text"
          placeholder="Choose a username"
          required
          autocomplete="username"
        >

        <label for="register-email">Email</label>
        <input
          id="register-email"
          type="email"
          placeholder="Enter your email"
          required
          autocomplete="email"
        >

        <label for="register-password">Password</label>
        <input
          id="register-password"
          type="password"
          placeholder="Create a password"
          required
          minlength="6"
          autocomplete="new-password"
        >

        <button type="submit" class="btn btn-primary auth-submit">
          Create Account
        </button>
      </form>

      <p class="auth-footer">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>
    </div>
  </main>

  <footer>
    <div class="logo">
      <span>GBC</span>
      <small>GRAND BILLIONAIRE CITY</small>
    </div>
    <p>© 2026 Grand Billionaire City. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
