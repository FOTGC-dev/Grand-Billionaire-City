<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Create Account | Grand Billionaire City</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>

<body class="auth-page">

  <header class="site-header">
    <a href="index.html" class="logo">
      <span>GBC</span>
      <small>GRAND BILLIONAIRE CITY</small>
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="index.html#store">Store</a>
      <a href="login.html">Player Login</a>
    </nav>
  </header>

  <main class="auth-container">
    <section class="auth-card">

      <p class="eyebrow">JOIN GBC</p>

      <h1>Create your account.</h1>

      <p class="auth-subtitle">
        Start building your empire today.
      </p>

      <form id="register-form">

        <label for="register-username">Username</label>

        <input
          type="text"
          id="register-username"
          name="username"
          placeholder="Choose a username"
          autocomplete="username"
          required
        />

        <label for="register-email">Email</label>

        <input
          type="email"
          id="register-email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        />

        <label for="register-password">Password</label>

        <input
          type="password"
          id="register-password"
          name="password"
          placeholder="Create a password"
          autocomplete="new-password"
          minlength="6"
          required
        />

        <label for="register-confirm-password">
          Confirm Password
        </label>

        <input
          type="password"
          id="register-confirm-password"
          name="confirm-password"
          placeholder="Repeat your password"
          autocomplete="new-password"
          minlength="6"
          required
        />

        <button type="submit" class="primary-button">
          Create Account
        </button>

        <p id="register-message" class="form-message"></p>

      </form>

      <p class="auth-footer">
        Already have an account?
        <a href="login.html">Log in</a>
      </p>

    </section>
  </main>

  <footer class="site-footer">
    <div class="logo">
      <span>GBC</span>
      <small>GRAND BILLIONAIRE CITY</small>
    </div>

    <p>© 2026 Grand Billionaire City. All rights reserved.</p>
  </footer>

</body>
</html>
