<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Billionaire City - Staff Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="nav-brand">
            <span class="brand-badge">GBC</span>
            <span class="brand-title">STAFF PORTAL</span>
        </div>
        <div class="nav-actions">
            <a href="index.html" class="btn-nav btn-nav-outline">HOME</a>
            <a href="marketplace.html" class="btn-nav btn-nav-outline">STORE</a>
            <button id="logoutBtn" class="btn-nav btn-danger" style="display: none;" onclick="userLogout()">LOGOUT</button>
        </div>
    </nav>

    <div class="page-view">
        <!-- AUTH SCREEN (Register or Login) -->
        <div id="authScreen" class="admin-form-container" style="margin-top: 40px;">
            <div class="tab-selector">
                <button id="tabLoginBtn" class="tab-btn active" onclick="switchAuthTab('login')">LOG IN</button>
                <button id="tabRegisterBtn" class="tab-btn" onclick="switchAuthTab('register')">REGISTER ACCOUNT</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleUserLogin(event)">
                <div class="section-title" style="font-size: 1.1rem; margin-bottom: 15px;">Staff Sign In</div>
                <div class="form-group">
                    <label>Username / Email</label>
                    <input type="text" id="loginUser" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPass" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" style="background: var(--accent-gold); padding: 12px;">LOG IN</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" style="display: none;" onsubmit="handleUserRegister(event)">
                <div class="section-title" style="font-size: 1.1rem; margin-bottom: 15px;">Create Staff Account</div>
                <div class="form-group">
                    <label>Choose Username</label>
                    <input type="text" id="regUser" placeholder="Choose username" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Create Password</label>
                    <input type="password" id="regPass" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" style="background: var(--accent-gold); padding: 12px;">REGISTER & LOGIN</button>
            </form>
        </div>

        <!-- UPLOAD PANEL SCREEN (Unlocked upon login) -->
        <div id="panelScreen" style="display: none;">
            <div id="welcomeUserBanner" style="text-align: center; margin-bottom: 25px; color: var(--accent-gold); font-weight: 700;"></div>
            <div class="section-title" style="text-align: center; justify-content: center;">UPLOAD ITEM TO MARKETPLACE</div>
            <div class="admin-form-container">
                <form id="uploadForm" onsubmit="handleItemUpload(event)">
                    <div class="form-group">
                        <label for="itemCategory">Select Target Category</label>
                        <select id="itemCategory" required>
                            <option value="coins">Buy GC Coin</option>
                            <option value="donators">Donator Tiers</option>
                            <option value="properties">Property Listings</option>
                            <option value="business">Business Properties</option>
                            <option value="vehicles" selected>Vehicle Collection</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="itemTitle">Item Name</label>
                        <input type="text" id="itemTitle" placeholder="e.g. Porsche 911 Turbo S" required>
                    </div>
                    <div class="form-group">
                        <label for="itemPrice">Price / Cost Display</label>
                        <input type="text" id="itemPrice" placeholder="e.g. 34 GC" required>
                    </div>
                    <div class="form-group">
                        <label for="itemTag">Badge / Stock Tag</label>
                        <input type="text" id="itemTag" placeholder="e.g. STOCK 5 • 10% OFF" required>
                    </div>

                    <!-- IMAGE INPUT METHOD TOGGLE (URL OR FILE UPLOAD) -->
                    <div class="form-group">
                        <label>Item Image Source</label>
                        <div class="tab-selector">
                            <button type="button" id="imgTabUrl" class="tab-btn active" onclick="switchImgInput('url')">Paste Image URL</button>
                            <button type="button" id="imgTabFile" class="tab-btn" onclick="switchImgInput('file')">Upload from Device</button>
                        </div>
                        <div id="urlInputBox">
                            <input type="url" id="itemImage" placeholder="https://images.unsplash.com/...">
                        </div>
                        <div id="fileInputBox" style="display: none;">
                            <input type="file" id="itemFile" accept="image/*">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="itemDesc">Description / Perks / Real-world equivalent</label>
                        <textarea id="itemDesc" rows="3" placeholder="Game Value: 75M • $1.35 • ₦2,000" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="background: var(--accent-gold); padding: 14px;">PUBLISH TO MARKETPLACE</button>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2022-2026 GRAND BILLIONAIRE CITY • GC COIN OFFICIAL</p>
    </footer>

    <script src="script.js"></script>
    <script>
        window.onload = () => {
            checkUserAuth();
        };
    </script>
</body>
</html>
