<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Billionaire City - Staff Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="nav-brand">
            <span class="brand-badge">GBC</span>
            <span class="brand-title">STAFF BACK-OFFICE</span>
        </div>
        <div class="nav-actions">
            <a href="index.html" class="btn-nav btn-nav-outline">HOME</a>
            <a href="marketplace.html" class="btn-nav">MARKET</a>
        </div>
    </nav>

    <div class="page-view">
        <div class="section-title" style="text-align: center;">UPLOAD NEW ITEM TO MARKETPLACE</div>
        <div class="admin-form-container">
            <form id="uploadForm" onsubmit="handleItemUpload(event)">
                <div class="form-group">
                    <label for="itemTitle">Item Name</label>
                    <input type="text" id="itemTitle" placeholder="e.g. Lamborghini Revuelto" required>
                </div>
                <div class="form-group">
                    <label for="itemPrice">Price (in GC Coin)</label>
                    <input type="number" id="itemPrice" placeholder="e.g. 54" required>
                </div>
                <div class="form-group">
                    <label for="itemTag">Stock / Badge Tag</label>
                    <input type="text" id="itemTag" placeholder="e.g. STOCK 5 • 10% OFF" required>
                </div>
                <div class="form-group">
                    <label for="itemImage">Image URL</label>
                    <input type="url" id="itemImage" placeholder="https://images.unsplash.com/..." required>
                </div>
                <div class="form-group">
                    <label for="itemDesc">Description / Value Specs</label>
                    <textarea id="itemDesc" rows="3" placeholder="Game Value: 120M • GTA ID 560" required></textarea>
                </div>
                <button type="submit" class="btn-primary" style="background: var(--accent-gold); padding: 14px;">UPLOAD ITEM TO MARKETPLACE</button>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 GRAND BILLIONAIRE CITY STUDIO | Nigeria Hub | All Rights Reserved</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
