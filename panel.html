<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Billionaire City - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav>
        <div class="nav-brand">
            <span class="brand-badge">GBC</span>
            <span class="brand-title">STAFF CONTROL PORTAL</span>
        </div>
        <div class="nav-actions">
            <span id="welcomeUserBanner" style="font-size: 0.85rem; color: var(--accent-gold);"></span>
            <a href="marketplace.html" class="btn-nav btn-nav-outline">STORE</a>
            <button class="btn-nav btn-danger" onclick="userLogout()">LOGOUT</button>
        </div>
    </nav>

    <div class="page-view" style="max-width: 900px; margin-top: 20px;">
        <div class="tab-selector" style="margin-bottom: 25px;">
            <button class="tab-btn active" onclick="switchPanelTab('items', this)"><i class="fa-solid fa-boxes-stacked"></i> Item Manager</button>
            <button class="tab-btn" onclick="switchPanelTab('support', this)"><i class="fa-solid fa-headset"></i> Live Support Desk</button>
            <button class="tab-btn" onclick="switchPanelTab('orders', this)"><i class="fa-solid fa-receipt"></i> Global Order Logs</button>
        </div>

        <!-- TAB 1: ITEM MANAGER -->
        <div class="panel-section" id="panelTab-items">
            <div class="admin-form-container" style="max-width: 100%;">
                <h3 style="margin-bottom: 15px;">Publish Marketplace Item</h3>
                <form id="uploadForm" onsubmit="handleItemUpload(event)">
                    <div class="form-group">
                        <label>Category Section</label>
                        <select id="itemCategory">
                            <option value="coins">GC Coins</option>
                            <option value="donators">Donator Tiers</option>
                            <option value="properties">Property Listings</option>
                            <option value="business">Business Properties</option>
                            <option value="vehicles">Vehicle Collection</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Item Title</label>
                        <input type="text" id="itemTitle" required placeholder="e.g. Skyline GT-R">
                    </div>
                    <div class="form-group">
                        <label>Price Display</label>
                        <input type="text" id="itemPrice" required placeholder="e.g. 25 GC">
                    </div>
                    <div class="form-group">
                        <label>Tag Badge</label>
                        <input type="text" id="itemTag" required placeholder="e.g. 10% OFF">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="itemDesc" rows="3" placeholder="Item perks or specs..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="url" id="itemImage" placeholder="https://image-link.com/photo.jpg">
                    </div>
                    <button type="submit" class="btn-primary">PUBLISH ITEM</button>
                </form>
            </div>
        </div>

        <!-- TAB 2: LIVE SUPPORT DESK -->
        <div class="panel-section" id="panelTab-support" style="display: none;">
            <div class="admin-form-container" style="max-width: 100%;">
                <h3 style="margin-bottom: 15px;">Live Customer Support Chat</h3>
                <div id="adminChatLog" style="height: 350px; background: #0a0a0a; border: 1px solid var(--card-border); border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px;">
                    <p style="color: var(--text-muted); text-align: center;">Waiting for player messages...</p>
                </div>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="adminReplyInput" placeholder="Reply to customer as support staff..." style="flex: 1; padding: 12px; background: #0a0a0a; border: 1px solid var(--card-border); color: white; border-radius: 6px;" onkeypress="handleAdminEnter(event)">
                    <button class="btn-primary" style="width: auto; padding: 0 20px;" onclick="sendAdminReply()">Send</button>
                </div>
            </div>
        </div>

        <!-- TAB 3: ORDER LOGS -->
        <div class="panel-section" id="panelTab-orders" style="display: none;">
            <div class="admin-form-container" style="max-width: 100%;">
                <h3 style="margin-bottom: 15px;">Global WhatsApp Checkout Logs</h3>
                <div id="orderLogsContainer" style="display: flex; flex-direction: column; gap: 10px;">
                    <p style="color: var(--text-muted); text-align: center;">No orders recorded yet.</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2022-2026 GRAND BILLIONAIRE CITY • STAFF PORTAL</p>
    </footer>

    <script src="script.js"></script>
    <script>
        window.onload = () => {
            const user = sessionStorage.getItem('gbc_logged_in_user');
            if(!user) {
                window.location.href = 'index.html';
                return;
            }
            document.getElementById('welcomeUserBanner').innerText = `Staff: ${user}`;
            loadAdminChatSession();
            loadOrderLogs();
            setInterval(() => {
                loadAdminChatSession();
                loadOrderLogs();
            }, 2000);
        };
    </script>
</body>
</html>
