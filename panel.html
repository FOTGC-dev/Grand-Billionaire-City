<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Billionaire City - Staff Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="nav-brand">
            <span class="brand-badge">GBC</span>
            <span class="brand-title">STAFF BACK-OFFICE</span>
        </div>
        <div class="nav-actions">
            <a href="index.html" class="btn-nav btn-nav-outline">HOME</a>
            <a href="marketplace.html" class="btn-nav btn-nav-outline">STORE</a>
            <button id="logoutBtn" class="btn-nav btn-danger" style="display: none;" onclick="staffLogout()">LOGOUT</button>
        </div>
    </nav>

    <div class="page-view">
        <!-- LOGIN SCREEN (Visible by default if not authenticated) -->
        <div id="loginScreen" class="admin-form-container" style="margin-top: 60px;">
            <div class="section-title" style="text-align: center; justify-content: center; margin-bottom: 10px;">STAFF LOGIN</div>
            <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 25px;">Enter administrative credentials to access item management panel.</p>
            <form onsubmit="handleStaffLogin(event)">
                <div class="form-group">
                    <label>Staff Username</label>
                    <input type="text" id="staffUser" placeholder="admin" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="staffPass" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" style="background: var(--accent-gold); padding: 14px;">AUTHENTICATE</button>
            </form>
        </div>

        <!-- UPLOAD PANEL SCREEN (Hidden until logged in) -->
        <div id="panelScreen" style="display: none;">
            <div class="section-title" style="text-align: center; justify-content: center;">UPLOAD NEW ITEM TO CATEGORY</div>
            <div class="admin-form-container">
                <form id="uploadForm" onsubmit="handleItemUpload(event)">
                    <div class="form-group">
                        <label for="itemCategory">Select Target Category</label>
                        <select id="itemCategory" required>
                            <option value="coins">Buy GC Coin</option>
                            <option value="donators">Donator Tiers</option>
                            <option value="properties">Property Listings</option>
                            <option value="business">Business Properties</option>
                            <option value="vehicles" selected>Vehicle Collection</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="itemTitle">Item Name</label>
                        <input type="text" id="itemTitle" placeholder="e.g. Porsche 911 Turbo S" required>
                    </div>
                    <div class="form-group">
                        <label for="itemPrice">Price / Cost Display</label>
                        <input type="text" id="itemPrice" placeholder="e.g. 34 GC" required>
                    </div>
                    <div class="form-group">
                        <label for="itemTag">Badge / Stock Tag</label>
                        <input type="text" id="itemTag" placeholder="e.g. STOCK 5 • 10% OFF" required>
                    </div>
                    <div class="form-group">
                        <label for="itemImage">Image URL (Optional for Coins/Tiers)</label>
                        <input type="url" id="itemImage" placeholder="https://images.unsplash.com/...">
                    </div>
                    <div class="form-group">
                        <label for="itemDesc">Description / Perks / Real-world equivalent</label>
                        <textarea id="itemDesc" rows="3" placeholder="Game Value: 75M • $1.35 • ₦2,000" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="background: var(--accent-gold); padding: 14px;">PUBLISH TO MARKETPLACE</button>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2022-2026 GRAND BILLIONAIRE CITY • GC COIN OFFICIAL</p>
    </footer>

    <script src="script.js"></script>
    <script>
        window.onload = () => {
            checkStaffAuth();
        };
    </script>
</body>
</html>
