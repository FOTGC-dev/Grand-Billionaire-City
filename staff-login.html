<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GBC Staff Login</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>

<body class="auth-page">

  <header class="site-header">
    <a href="index.html" class="logo">GRAND BILLIONAIRE CITY</a>
  </header>

  <main class="auth-container">
    <section class="auth-card">
      <p class="eyebrow">STAFF ACCESS</p>

      <h1>Staff Login</h1>

      <p class="auth-subtitle">
        Authorized GBC staff only.
      </p>

      <form id="staff-login-form">

        <label for="staff-login">Username or Email</label>
        <input
          type="text"
          id="staff-login"
          placeholder="Enter username or email"
          required
        />

        <label for="staff-password">Password</label>
        <input
          type="password"
          id="staff-password"
          placeholder="Enter password"
          required
        />

        <button type="submit" class="primary-button">
          Enter Staff Panel
        </button>

        <p id="staff-login-message" class="form-message"></p>

      </form>

      <p class="auth-footer">
        <a href="index.html">Return to website</a>
      </p>
    </section>
  </main>

</body>
</html>
