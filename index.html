<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Billionaire City - Player Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav>
        <div class="nav-brand">
            <span class="brand-badge">GBC</span>
            <span class="brand-title">GRAND BILLIONAIRE CITY</span>
        </div>
        <div class="nav-actions">
            <a href="marketplace.html" class="btn-nav">STORE</a>
            <a href="faq.html" class="btn-nav">FAQ</a>
            <a href="index.html" class="btn-nav btn-nav-outline" id="profileLinkNav" style="display:none;"><i class="fa-solid fa-user"></i> ACCOUNT</a>
        </div>
    </nav>

    <div class="page-view" style="max-width: 500px; margin-top: 50px;">
        <div class="admin-form-container">
            <div id="loggedInView" style="display: none; text-align: center;">
                <h3 style="color: var(--accent-gold); margin-bottom: 15px;">Welcome back, <span id="displayUsername">Player</span>!</h3>
                <button class="btn-primary btn-danger" onclick="userLogout()">LOGOUT</button>
            </div>
            <div id="loggedOutView">
                <h3 style="margin-bottom: 20px; text-align: center;">Player Access Portal</h3>
                <div class="tab-selector" style="margin-bottom: 20px;">
                    <button class="tab-btn active" id="tabLoginBtn" onclick="switchAuthTab('login')">Login</button>
                    <button class="tab-btn" id="tabRegisterBtn" onclick="switchAuthTab('register')">Register</button>
                </div>
                <form id="loginForm" onsubmit="handleUserLogin(event)">
                    <div class="form-group"><label>Username or Email</label><input type="text" id="loginUser" required></div>
                    <div class="form-group"><label>Password</label><input type="password" id="loginPass" required></div>
                    <button type="submit" class="btn-primary">LOGIN</button>
                </form>
                <form id="registerForm" style="display: none;" onsubmit="handleUserRegister(event)">
                    <div class="form-group"><label>Username</label><input type="text" id="regUser" required></div>
                    <div class="form-group"><label>Email Address</label><input type="email" id="regEmail" required></div>
                    <div class="form-group"><label>Password</label><input type="password" id="regPass" required></div>
                    <button type="submit" class="btn-primary">CREATE ACCOUNT</button>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <a href="terms.html">Terms & Conditions</a>
        <a href="faq.html">FAQ</a>
        <a href="404.html">Support</a>
    </footer>

    <script src="script.js"></script>
    <script>
        function switchAuthTab(tab) {
            document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
            document.getElementById('tabLoginBtn').classList.toggle('active', tab === 'login');
            document.getElementById('tabRegisterBtn').classList.toggle('active', tab === 'register');
        }
        window.onload = () => checkIndexAuth();
    </script>
</body>
</html>
