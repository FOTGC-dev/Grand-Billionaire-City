<!DOCTYPE html>
<html lang="en">
<head>

    <title>Grand Billionaire City - GC Coin Store</title>
    <link rel="stylesheet" href="style.css">

<body>

    <nav>

    <div class="page-view">

    </footer>

    <script src="script.js"></script>
    <script>
        // Render Marketplace items when page loads
        window.onload = () => {
            if(typeof renderMarketplace === 'function') {
                renderMarketplace();
            }
        };
