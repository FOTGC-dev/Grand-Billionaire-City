<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Billionaire City - Live Support Backend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="nav-brand">
            <span class="brand-badge">GBC</span>
            <span class="brand-title">LIVE SUPPORT BACKEND PANEL</span>
        </div>
        <div class="nav-actions">
            <a href="panel.html" class="btn-nav btn-nav-outline">ITEM PANEL</a>
            <a href="marketplace.html" class="btn-nav btn-nav-outline">STORE</a>
        </div>
    </nav>

    <div class="page-view" style="max-width: 800px; margin-top: 30px;">
        <div class="section-title">Live Customer Chats</div>
        <div class="admin-form-container">
            <div id="adminChatLog" style="height: 300px; background: #0a0a0a; border: 1px solid var(--card-border); border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px;">
                <p style="color: var(--text-muted); text-align: center;">Waiting for incoming player messages...</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="adminReplyInput" placeholder="Type reply as staff..." style="flex: 1; padding: 12px; background: #0a0a0a; border: 1px solid var(--card-border); color: white; border-radius: 6px;" onkeypress="handleAdminEnter(event)">
                <button class="btn-primary" style="width: auto; padding: 0 20px;" onclick="sendAdminReply()">Reply</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        window.onload = () => {
            loadAdminChatSession();
            setInterval(loadAdminChatSession, 2000); // Poll messages live
        };
    </script>
</body>
</html>
